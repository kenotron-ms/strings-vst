name: Build, validate and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
            configure: -G Ninja
          - os: windows-2022
            platform: windows-x86_64
            configure: -G "Visual Studio 17 2022" -A x64
          - os: macos-15
            platform: macos-universal
            configure: -G Ninja -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ninja-build libgl1-mesa-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libasound2-dev libpulse-dev libjack-jackd2-dev xvfb xdotool imagemagick jackd2 jack-tools
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.configure }}
      - name: Build
        run: cmake --build build --config Release --parallel 3
      - name: Engine tests
        run: ctest --test-dir build -C Release --output-on-failure
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install host test dependencies
        run: python -m pip install pedalboard==0.9.26 numpy==2.2.6 mido==1.3.3
      - name: Tool regression tests
        shell: bash
        run: |
          python tests/midi_strings_tests.py
          python tests/standalone_workflow_tests.py
      - name: Linux delivery tooling fixtures
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python tests/package_guard_tests.py
          python tests/delivery_manifest_tests.py
      - name: Render audio examples
        shell: bash
        run: |
          mkdir -p build/demos
          RENDER=build/strings_render
          if [ "$RUNNER_OS" = Windows ]; then RENDER=build/Release/strings_render.exe; fi
          "$RENDER" build/demos/violin-solo.wav 0 1 0
          "$RENDER" build/demos/viola-section.wav 1 8 0
          "$RENDER" build/demos/cello-solo.wav 2 1 0
          "$RENDER" build/demos/bass-pizzicato.wav 3 1 1
          "$RENDER" build/demos/violins-tremolo.wav 0 12 2
      - name: Ad-hoc sign macOS binaries
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep --sign - build/bin/Strings.vst3
          codesign --force --deep --sign - build/bin/Strings.clap
          if [ -d build/bin/Strings.app ]; then codesign --force --deep --sign - build/bin/Strings.app; else codesign --force --sign - build/bin/Strings; fi
          lipo build/bin/Strings.vst3/Contents/MacOS/Strings -verify_arch x86_64 arm64
          lipo build/bin/Strings.clap/Contents/MacOS/Strings -verify_arch x86_64 arm64
          codesign --verify --deep --strict build/bin/Strings.vst3
          codesign --verify --deep --strict build/bin/Strings.clap
          if [ -d build/bin/Strings.app ]; then
            codesign --verify --deep --strict build/bin/Strings.app
            lipo build/bin/Strings.app/Contents/MacOS/Strings -verify_arch x86_64 arm64
          else
            codesign --verify --strict build/bin/Strings
            lipo build/bin/Strings -verify_arch x86_64 arm64
          fi
      - name: Validate VST3 (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python3 tools/validate_plugin.py build/bin/Strings.vst3
      - name: Validate VST3 (Windows/macOS)
        if: runner.os != 'Linux'
        run: python tools/validate_plugin.py build/bin/Strings.vst3
      - name: Actual VST3 audio and state tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python tests/host_smoke.py build/bin/Strings.vst3
      - name: Actual VST3 audio and state tests (Windows/macOS)
        if: runner.os != 'Linux'
        run: python tests/host_smoke.py build/bin/Strings.vst3
      - name: Native keyboard and bow UI tests (Linux)
        if: runner.os == 'Linux'
        run: |
          python tests/native_keyboard_smoke.py
          python tests/native_expression_pad_smoke.py
      - name: Record build identity
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          identity = {name: os.environ[name] for name in ("GITHUB_SHA", "GITHUB_RUN_ID", "GITHUB_REPOSITORY", "RUNNER_OS", "RUNNER_ARCH")}
          Path("build/build-info.json").write_text(json.dumps(identity, indent=2) + "\n")
          PY
      - name: Package
        run: python tools/package.py ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: Strings-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.platform }}
          path: build/pluginval-logs/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audio-measurements-${{ matrix.platform }}
          path: build/host-smoke.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Linux'
        with:
          name: native-ui-${{ matrix.platform }}
          path: |
            build/live-keyboard-validation/*.json
            build/live-keyboard-validation/*.png
            build/live-expression-validation/*.json
            build/live-expression-validation/*.png
          if-no-files-found: ignore

  sanitizers:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DSTRINGS_BUILD_PLUGIN=OFF -DSTRINGS_SANITIZE=ON -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, sanitizers]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: Strings-*
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd release-assets
          sha256sum *.zip > SHA256SUMS.txt
          gh release create "$RELEASE_TAG" *.zip SHA256SUMS.txt --title "Strings $RELEASE_TAG" --notes-file ../docs/release-notes.md --verify-tag
